name: Deploy

# Deploys on every push to main. Assumes CI (ci.yml) is the quality gate; this
# job builds the images on the VPS and restarts the stack. One at a time.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"
            echo "==> Pulling latest code"
            git pull --ff-only
            echo "==> Building images"
            docker compose -f docker-compose.prod.yml build
            echo "==> Ensuring database is up"
            docker compose -f docker-compose.prod.yml up -d postgres redis
            echo "==> Running migrations"
            docker compose -f docker-compose.prod.yml run --rm worker pnpm --filter @solax/db migrate:deploy
            echo "==> Rolling out web + worker"
            docker compose -f docker-compose.prod.yml up -d
            echo "==> Pruning old images"
            docker image prune -f
            echo "==> Deploy complete"

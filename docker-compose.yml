services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: solax_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: solax
      POSTGRES_PASSWORD: solax_dev_password
      POSTGRES_DB: solax
    ports:
      - "5432:5432"
    volumes:
      - solax_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solax -d solax"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: solax_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - solax_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  solax_pg_data:
  solax_redis_data:
